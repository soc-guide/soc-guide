name: Data correction
description: Report incorrect character, skill, gear, tarot, or lore information.
title: "[Data]: "
labels: ["data", "needs-verification"]
body:
  - type: input
    id: record
    attributes:
      label: Affected record
      placeholder: Character, skill, gear, tarot, or lore entry
    validations:
      required: true
  - type: textarea
    id: current
    attributes:
      label: Current guide value
    validations:
      required: true
  - type: textarea
    id: corrected
    attributes:
      label: Correct value
    validations:
      required: true
  - type: textarea
    id: source
    attributes:
      label: Verification source
      description: Include region, game version, screenshot, or reliable source.
    validations:
      required: true
